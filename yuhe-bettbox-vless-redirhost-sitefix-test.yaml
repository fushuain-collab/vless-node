# YUHE Bettbox / Mihomo - redir-host site-fix test, sniffer disabled
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
find-process-mode: strict
global-client-fingerprint: chrome
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: false
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: redir-host
  respect-rules: true
  use-hosts: false
  use-system-hosts: false
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  direct-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  fallback:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  - tls://1.1.1.1:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
    - gfw
    ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
    domain:
    - +.google.com
    - +.github.com
    - +.youtube.com
    - +.telegram.org
    - +.openai.com
    - +.chatgpt.com
    - +.anthropic.com
    - +.claude.ai
  nameserver-policy:
    geosite:cn:
    - 223.5.5.5
    - 119.29.29.29
    geosite:geolocation-!cn:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    domain:raw.githubusercontent.com:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    domain:github.com:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    domain:githubusercontent.com:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    domain:yes1.xn--mesv7f5toqlp.biz:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    domain:xn--mesv7f5toqlp.biz:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
