name: Validate subscriptions

on:
  push:
    paths:
      - '*.yaml'
      - '*.yml'
      - 'tools/**'
      - '.github/workflows/validate-subscriptions.yml'
  pull_request:
    paths:
      - '*.yaml'
      - '*.yml'
      - 'tools/**'
      - '.github/workflows/validate-subscriptions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate subscription artifacts
        run: python tools/validate_subscriptions.py
